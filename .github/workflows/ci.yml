name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  PUBLIC_REGISTRATION_ENABLED: "false"
  SITE_INDEXING_ENABLED: "false"

  # Nilai khusus CI. Bukan kredensial database sebenarnya.
  DATABASE_URL: >-
    postgresql://ci_user:ci_password@ep-ci-placeholder-pooler.us-east-2.aws.neon.tech/ci_db?sslmode=require
  DIRECT_DATABASE_URL: >-
    postgresql://ci_user:ci_password@ep-ci-placeholder.us-east-2.aws.neon.tech/ci_db?sslmode=require

  BETTER_AUTH_SECRET: >-
    ci-only-secret-7d54f5efb14046a693c149f6d3f72527
  BETTER_AUTH_URL: "http://127.0.0.1:3100"

jobs:
  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  quality:
    name: Code quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Run project verification
        run: pnpm verify

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Run registration-enabled Playwright tests
        run: pnpm test:e2e:registration

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
